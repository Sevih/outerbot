name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sevih/outerbot # doit être en minuscules pour GHCR

# Par défaut, le jeton du workflow ne fait que lire ; le job `docker` élargit
# à `packages: write` pour publier l'image.
permissions:
  contents: read

jobs:
  # Vérifications de qualité (sur PR et push) — même chaîne que le site.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sans `version:`, l'action lit "packageManager" de package.json — la
      # version de pnpm se déclare à UN seul endroit (même règle que le site).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc = seule source de vérité de la version Node.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # tsc emit (~2 s) : la preuve que dist/ se construit — le Dockerfile refait
      # ce build mais lui ne tourne pas sur PR.
      - run: pnpm build

  # Build de l'image Docker + publication sur GHCR (uniquement sur push main).
  docker:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          # `min` : n'exporte que les couches de l'image finale (cf. le
          # commentaire détaillé dans le ci.yml du site).
          cache-to: type=gha,mode=min

  # Déploiement automatique sur le VPS (après build de l'image).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Sérialise les deploys de CE repo (deux pushes rapprochés = deux
    # `compose up` simultanés qui se percutent — vécu côté site le 30/07,
    # cf. son ci.yml). La course INTER-repos (le site déploie la même stack)
    # est tenue par le flock côté VPS, dans `scripts/deploy.sh` de sevih-tool.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # Le script attend le verrou 10 min au plus, puis pull et up : 20 min couvrent.
    timeout-minutes: 20
    steps:
      - name: Déploiement SSH sur le VPS
        # Pas d'action tierce : la clé de déploiement ne passe que par `ssh`.
        # Côté VPS, cette clé est en commande FORCÉE (`restrict,command=` dans
        # authorized_keys) : elle ne peut lancer que `scripts/deploy.sh` de
        # sevih-tool, qui ne lit que le dernier mot de la commande (le service,
        # pris dans une liste blanche) et ne redéploie que lui. Le flock
        # inter-dépôts, le déchiffrement de stack/.env, `pull`, `up -d` et
        # `prune` vivent dans ce script.
        # L'empreinte du serveur est vérifiée : `VPS_KNOWN_HOSTS` porte sa ligne
        # de known_hosts sous l'alias `vps` (`HostKeyAlias`), quelle que soit la
        # forme de `VPS_HOST` ; pas de confiance au premier contact.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Un secret collé à la main peut porter un espace ou un retour à la
          # ligne en trop ; `ssh` refuse alors l'hôte (« hostname contains
          # invalid characters »). On les retire.
          host="${VPS_HOST//[[:space:]]/}"
          user="${VPS_USER//[[:space:]]/}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=vps \
            -o ServerAliveInterval=30 \
            "$user@$host" 'bash ~/sevih-tool/scripts/deploy.sh outerbot'

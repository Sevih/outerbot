name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sevih/outerbot # doit être en minuscules pour GHCR

jobs:
  # Vérifications de qualité (sur PR et push) — même chaîne que le site.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sans `version:`, l'action lit "packageManager" de package.json — la
      # version de pnpm se déclare à UN seul endroit (même règle que le site).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc = seule source de vérité de la version Node.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # tsc emit (~2 s) : la preuve que dist/ se construit — le Dockerfile refait
      # ce build mais lui ne tourne pas sur PR.
      - run: pnpm build

  # Build de l'image Docker + publication sur GHCR (uniquement sur push main).
  docker:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          # `min` : n'exporte que les couches de l'image finale (cf. le
          # commentaire détaillé dans le ci.yml du site).
          cache-to: type=gha,mode=min

  # Déploiement automatique sur le VPS (après build de l'image).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Sans `set -e`, un `compose up` en échec serait masqué par le code
            # de retour du `prune` final (cf. ci.yml du site pour le détail).
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd ~/sevih-tool
            # Régénère stack/.env depuis le coffre chiffré (le compose exige des
            # variables `${VAR:?}` — resynchronisé à chaque déploiement).
            ./scripts/secrets-decrypt.sh
            cd stack
            docker compose pull
            docker compose up -d
            docker image prune -f
